{% extends "base.html" %}

{% block back_link %}
<a href="/" class="back-link">&lt;&lt; Back</a>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title" data-i18n="login">Login</h2>
        
        {% if error %}
            <div class="auth-error" data-i18n="error_invalid_login">{{ error }}</div>
        {% endif %}
        
        <form action="/login" method="POST" class="auth-form">
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <div class="form-group">
                <label for="email" data-i18n="email">E-mail:</label>
                <input type="email" id="email" name="email" required class="input-delphi">
            </div>
            
            <div class="form-group">
                <label for="password" data-i18n="password">Password:</label>
                <input type="password" id="password" name="password" required class="input-delphi">
            </div>
            
            <div class="auth-actions">
                <a href="#" class="forgot-link" data-i18n="forgot_password" onclick="alert(localStorage.getItem('spear_lang') === 'pt' ? 'Por favor, entre em contato com o seu administrador para redefinir sua senha.' : 'Please contact your administrator to reset your password.')">Forgot password?</a>
                <button type="submit" class="btn btn-delphi-action" data-i18n="enter">Enter</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
