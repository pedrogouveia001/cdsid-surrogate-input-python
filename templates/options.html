{% extends "base.html" %}

{% block back_link %}
<a href="/logout" class="back-link">&lt;&lt; Back</a>
{% endblock %}

{% block content %}
<div class="options-container">
    <h2 class="options-header" data-i18n="choose_option">Please, choose an option:</h2>
    
    <div class="options-row">
        <!-- Card 1: Register new problem -->
        <div class="option-card">
            <div class="option-icon">
                <!-- SVG Document with Plus Sign -->
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#003366" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
            </div>
            <a href="/setup" class="btn btn-delphi-option" data-i18n="register_new_problem">Register new problem</a>
        </div>
        
        <!-- Card 2: Continue a registered issue -->
        <div class="option-card">
            <div class="option-icon">
                <!-- SVG Document with Arrow -->
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#006699" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <polyline points="9 15 12 15 12 12"></polyline>
                    <path d="M12 15l4-4"></path>
                </svg>
            </div>
            <a href="/continue" class="btn btn-delphi-option" data-i18n="continue_registered_issue">Continue a registered issue</a>
        </div>
    </div>
</div>
{% endblock %}
